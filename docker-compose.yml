version: '3.8'

services:
  # Relational Database: PostgreSQL (Can be replaced with external Supabase URL)
  postgres:
    image: postgres:16-alpine
    container_name: news-aggregator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: news_aggregator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache: Redis
  redis:
    image: redis:7-alpine
    container_name: news-aggregator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python NLP & BERT Inference Service
  nlp:
    build:
      context: ./services/nlp
      dockerfile: Dockerfile
    container_name: news-aggregator-nlp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NLP_MODEL_NAME=distilbert/distilbert-base-uncased-finetuned-sst-2-english
      - NLP_MODEL_VERSION=v1.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend REST API (Node.js Express + Prisma)
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: news-aggregator-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/news_aggregator?schema=public
      - REDIS_URL=redis://redis:6379
      - ENABLE_REDIS=true
      - NLP_SERVICE_URL=http://nlp:8000
      - CORS_ORIGIN=http://localhost:5173
      - ENABLE_MOCK_FALLBACK=true

  # Frontend Web Interface (React + Vite)
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: news-aggregator-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
